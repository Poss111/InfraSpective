name: Publish CLI Binaries

on:
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload binaries to.
        required: true

permissions:
  contents: write

jobs:
  publish-cli:
    name: Build and upload CLI binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache pkg base runtimes
        uses: actions/cache@v4
        with:
          path: .pkg-cache
          key: pkg-cache-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pkg-cache-${{ runner.os }}-node20-

      - name: Install dependencies
        run: npm ci

      - name: Build standalone CLI binaries
        run: npm run package:cli

      - name: Smoke test Linux binary
        run: ./release/infraspective-linux-x64 analyze samples/aws-small.tfstate.json --mode state --format text

      - name: Generate checksums
        run: |
          cd release
          sha256sum infraspective-macos-arm64 infraspective-linux-x64 infraspective-win-x64.exe > SHA256SUMS.txt

      - name: Upload binaries to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release/infraspective-macos-arm64 \
            release/infraspective-linux-x64 \
            release/infraspective-win-x64.exe \
            release/SHA256SUMS.txt \
            --clobber
